<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Recycling Detector</title>
    <!-- Bootstrap CSS for layout and typography -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">
    <div class="container py-2">
        <header class="text-center mb-3">
            <h1 class="h2 fw-bold text-success">♻️ Smart Recycling</h1>
            <p class="lead text-muted">Show your item to the camera. Press <strong>Enter</strong> on your keyboard or push the <strong>Joystick</strong> to scan.</p>
        </header>
        
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <!-- Camera Viewfinder -->
                <div class="card shadow-lg border-0 mb-2 bg-dark text-white rounded-4 overflow-hidden position-relative viewfinder-container">
                    <!-- Video stream from webcam/phone -->
                    <video id="camera-stream" autoplay playsinline class="w-100 h-100 object-fit-cover"></video>
                    <!-- Hidden canvas to capture frames -->
                    <canvas id="snapshot-canvas" style="display: none;"></canvas>
                    
                    <!-- Loading Overlay -->
                    <div id="scanning-overlay" class="position-absolute top-0 start-0 w-100 h-100 flex-column justify-content-center align-items-center bg-dark bg-opacity-75 z-2" style="display: none;">
                        <div class="spinner-border text-success mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
                        <h4 class="fw-bold tracking-wide text-uppercase">Scanning Item...</h4>
                    </div>

                    <!-- Framing Reticle -->
                    <div class="reticle"></div>
                </div>

                <!-- Manual Trigger Button -->
                <div class="text-center mb-3" id="action-container">
                    <button id="capture-btn" class="btn btn-success btn-lg px-5 rounded-pill shadow-sm fw-bold">
                        📷 Scan Now
                    </button>
                </div>

                <!-- Results Display -->
                <div id="result-card" class="card shadow-lg border-0 rounded-4 text-center p-3 result-pop" style="display: none;">
                    <div class="mb-3">
                        <span id="result-icon" class="display-1">📦</span>
                    </div>
                    <h2 id="result-title" class="fw-bold mb-2 display-6">Category</h2>
                    
                    <!-- Base Instruction from Backend -->
                    <p id="result-desc" class="lead text-muted mb-4" style="display: none;">Instructions go here.</p>

                    <!-- Interactive Q&A Section -->
                    <div id="qa-section" class="mt-4 pt-4 border-top" style="display: none;">
                        <h4 id="qa-question" class="fw-bold mb-4">Question goes here?</h4>
                        
                        <div class="row g-3 justify-content-center" id="qa-options">
                            <!-- Options will be injected here via JS -->
                        </div>
                    </div>

                    <!-- Final Instruction after Q&A -->
                    <div id="final-instruction" class="mt-4 pt-3 text-success fw-bold fs-5" style="display: none;">
                        Final instruction here.
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="statusToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold" id="toastMessage">
                    Checking model status...
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS for Toasts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS logic -->
    <script src="/static/app.js"></script>
</body>
</html>
